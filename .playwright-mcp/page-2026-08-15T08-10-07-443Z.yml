        - heading "Department of Architecture" [level=2] [ref=f19e113]
        - generic [ref=f19e114]:
          - generic [ref=f19e115]:
            - paragraph [ref=f19e116]: The Department of Architecture, under the Faculty of Science & Engineering, offers the Bachelor of Architecture (B.Arch) degree at Sonargaon University (SU). The programme follows the academic and professional standards of the Institute of Architects Bangladesh (IAB), with a continuously updated curriculum designed to meet contemporary needs while allowing flexibility based on students’ interests. Design studios form the core of the programme, supported by a 1:10 teacher-student ratio, industry-oriented projects, and research-based learning. The department also promotes co-curricular activities, cultural engagement, and strong connections with industry and other stakeholders to prepare students for successful professional careers.
            - generic [ref=f19e117]:
              - link "Explore More" [ref=f19e118] [cursor=pointer]:
